[package]
name = "gale"
version = "1.22.2"
description = "A lightweight mod manager for Thunderstore"
authors = ["Kesomannen"]
license = "GPL-3.0"
repository = "https://github.com/Kesomannen/gale"
default-run = "gale"
edition = "2024"
rust-version = "1.91"

[[bin]]
name = "gale"
path = "src/main.rs"

[build-dependencies]
chrono = "0.4"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = { version = "2.3.2", features = ["deep-link"] }
tauri-plugin-store = "2"

serde_json = "1"
serde = { version = "1", features = ["derive"] }

tokio = { version = "1", features = ["full"] }

eyre = "0.6"
thiserror = "1"
justerror = "1"

futures-util = { version = "0.3", features = ["io", "sink"] }
indexmap = { version = "2", features = ["serde"] }
open = "5"
itertools = "0.13"
zip = { version = "2", features = ["deflate"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "rustls"] }
walkdir = "2"
image = "0.25"
semver = { version = "1", features = ["serde"] }
serde_yaml = "0.9"
base64 = "0.22"
heck = "0.5"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = [
    "windows-native",
    "linux-native-sync-persistent",
] }
dirs-next = "2"
trash = "5"
tempfile = "3"
rayon = "1"
bytes = "1"
strum = "0.26"
strum_macros = "0.26"
rusqlite = { version = "0.32", features = ["bundled", "uuid", "trace"] }
rusqlite_migration = { version = "1.3.1", features = ["from-directory"] }
include_dir = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
blake3 = "1"
which = { version = "7", features = ["tracing"] }
steamlocate = "2"
flate2 = "1"
font-kit = "0.14"
internment = { version = "0.8.6", features = ["serde"] }
new-vdf-parser = "0.1.0"
tracing-log = "0.2.0"
shell-words = "1.1.1"
winsplit = "0.1.0"
globset = "0.4.18"
humansize = "2.1.3"
reqwest-middleware = { version = "0.5.2", features = ["json"] }
http-cache-reqwest = "1.0.0-alpha.6"
http = "1.0"
tokio-websockets = { version = "0.13", features = [
    "client",
    "getrandom",
    "aws_lc_rs",
    "rustls-webpki-roots",
] }
rustls = { version = "0.23.43", features = ["aws_lc_rs"] }
tokio-util = "0.7.19"

[target.'cfg(target_os="windows")'.dependencies]
windows = { version = "0.62", features = ["UI", "UI_ViewManagement"] }
winreg = "0.52"

[target.'cfg(target_os="linux")'.dependencies]
webkit2gtk = "2.0.1"
ashpd = { version = "0.13", features = ["settings"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
codegen-units = 1
strip = true
lto = true
